# Production stack for the home server, deployed as a Portainer stack.
# Every value comes from the stack's environment variables (set in Portainer);
# .env.example lists them. Images are built by GitHub Actions, never here.
name: job-ai

x-app-env: &app-env
  DATABASE_URL: postgres://jobai:${POSTGRES_PASSWORD}@postgres:5432/jobai
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?set AI_GATEWAY_API_KEY}
  # Optional: without it, no Discord messages are sent.
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: jobai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobai -d jobai"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/cjrussell23/job-ai-web:${IMAGE_TAG:-latest}
    # The tunnel reaches the app by this name: http://job-ai-web:3000
    container_name: job-ai-web
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: web
    depends_on:
      postgres:
        condition: service_healthy
    # No published port: the only way in is the Cloudflare Tunnel, whose cloudflared
    # container shares the "tunnel" network below.
    networks:
      - default
      - tunnel

  worker:
    image: ghcr.io/cjrussell23/job-ai-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      SCRAPER_URL: http://scraper:8000
    command: ["npm", "run", "worker"]
    depends_on:
      web:
        condition: service_started
      scraper:
        condition: service_started

  # JobSpy wrapper for Indeed and LinkedIn; reachable only by the worker on the stack's network.
  scraper:
    image: ghcr.io/cjrussell23/job-ai-scraper:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: ghcr.io/cjrussell23/job-ai-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://jobai:${POSTGRES_PASSWORD}@postgres:5432/jobai
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      TZ: America/Edmonton
    volumes:
      # A directory on a different drive from the database's, e.g. the 14 TB drive.
      - ${BACKUP_DIR:?set BACKUP_DIR}:/backups
    depends_on:
      postgres:
        condition: service_healthy

networks:
  tunnel:
    external: true
    # The Docker network the cloudflared container is on.
    name: ${TUNNEL_NETWORK:-cloudflared-complete_default}

volumes:
  postgres-data:
