# Production stack for the home server. Copy .env.example to .env and fill it in first.
name: job-ai

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jobai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobai -d jobai"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/cjrussell23/job-ai-web:${IMAGE_TAG:-latest}
    build: ./web
    # The tunnel reaches the app by this name: http://job-ai-web:3000
    container_name: job-ai-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://jobai:${POSTGRES_PASSWORD}@postgres:5432/jobai
      SERVICE_NAME: web
    depends_on:
      postgres:
        condition: service_healthy
    # No published port: the only way in is the Cloudflare Tunnel, whose cloudflared
    # container shares the "tunnel" network below.
    networks:
      - default
      - tunnel

  worker:
    image: ghcr.io/cjrussell23/job-ai-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://jobai:${POSTGRES_PASSWORD}@postgres:5432/jobai
      SERVICE_NAME: worker
    command: ["npm", "run", "worker"]
    depends_on:
      web:
        condition: service_started

  backup:
    image: ghcr.io/cjrussell23/job-ai-backup:${IMAGE_TAG:-latest}
    build: ./backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://jobai:${POSTGRES_PASSWORD}@postgres:5432/jobai
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      TZ: America/Edmonton
    volumes:
      # Point BACKUP_DIR at a different drive from the database's, e.g. the 14 TB drive.
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

networks:
  tunnel:
    external: true
    # The Docker network the cloudflared container is on.
    name: ${TUNNEL_NETWORK:-cloudflared-complete_default}

volumes:
  postgres-data:
