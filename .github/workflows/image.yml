name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/job-ai-web:latest
            ghcr.io/${{ github.repository_owner }}/job-ai-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backup
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/job-ai-backup:latest
            ghcr.io/${{ github.repository_owner }}/job-ai-backup:${{ github.sha }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
